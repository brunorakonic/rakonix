<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registracija | Rakonix</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <main>

        <section class="auth-sekcija">

            <div class="auth-kartica">

                <span class="section-label">Rakonix račun</span>

                <h1>Registracija</h1>

                <p>
                    Izradite korisnički račun za pristup svojim projektima
                    i datotekama.
                </p>

                <form id="registracija-forma">

                    <div class="form-group">
                        <label for="reg-ime">Ime i prezime</label>

                        <input
                            type="text"
                            id="reg-ime"
                            name="ime"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="reg-email">Email</label>

                        <input
                            type="email"
                            id="reg-email"
                            name="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="reg-lozinka">Lozinka</label>

                        <input
                            type="password"
                            id="reg-lozinka"
                            name="lozinka"
                            minlength="6"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="reg-lozinka-ponovno">
                            Ponovite lozinku
                        </label>

                        <input
                            type="password"
                            id="reg-lozinka-ponovno"
                            name="lozinkaPonovno"
                            minlength="6"
                            required
                        >
                    </div>

                    <button type="submit" class="form-btn">
                        Registriraj se
                    </button>

                    <p id="registracija-status" aria-live="polite"></p>

                </form>

                <p class="auth-prijava-link">
                    Već imate račun?
                    <a href="prijava.html">Prijavite se</a>
                </p>

            </div>

        </section>

    </main>

    <script type="module" src="js/registracija.js"></script>

</body>
<header class="auth-header">

    <a href="index.html" class="auth-logo">
        <img
            src="slike/rakonix bijela slova transparent.svg"
            alt="Rakonix"
        >
    </a>

    <a href="index.html" class="auth-povratak">
        Povratak na stranicu
    </a>

</header>
</html>
